<!DOCTYPE html>

<html class="dark" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Flight Control - Mona Protocol</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#31353c",
                        "on-tertiary-container": "#fffcff",
                        "on-secondary": "#3d235e",
                        "surface-container-low": "#181c22",
                        "primary": "#7bdb80",
                        "on-background": "#dfe2eb",
                        "error-container": "#93000a",
                        "tertiary": "#afc6ff",
                        "on-surface-variant": "#becaba",
                        "secondary-fixed": "#eddcff",
                        "secondary": "#d8b9ff",
                        "surface-tint": "#7bdb80",
                        "tertiary-container": "#1f6feb",
                        "on-error": "#690005",
                        "on-primary": "#00390e",
                        "surface-container-high": "#262a31",
                        "primary-container": "#238636",
                        "tertiary-fixed-dim": "#afc6ff",
                        "secondary-container": "#563d79",
                        "on-primary-container": "#f9fff3",
                        "outline-variant": "#3f4a3d",
                        "on-surface": "#dfe2eb",
                        "on-secondary-fixed": "#270b48",
                        "tertiary-fixed": "#d9e2ff",
                        "primary-fixed": "#97f999",
                        "secondary-fixed-dim": "#d8b9ff",
                        "on-primary-fixed-variant": "#005319",
                        "background": "#10141a",
                        "on-tertiary-fixed-variant": "#004299",
                        "surface-container": "#1c2026",
                        "on-tertiary-fixed": "#001944",
                        "inverse-primary": "#006e23",
                        "on-secondary-container": "#caabf0",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#dfe2eb",
                        "on-secondary-fixed-variant": "#543a76",
                        "on-primary-fixed": "#002106",
                        "primary-fixed-dim": "#7bdb80",
                        "inverse-on-surface": "#2d3137",
                        "surface": "#10141a",
                        "error": "#ffb4ab",
                        "surface-variant": "#31353c",
                        "surface-bright": "#353940",
                        "surface-dim": "#10141a",
                        "outline": "#899485",
                        "on-tertiary": "#002d6d",
                        "surface-container-lowest": "#0a0e14"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #10141a; overflow: hidden; }
        .font-headline { font-family: 'Space Grotesk', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .glass-panel { backdrop-filter: blur(16px); background: rgba(16, 20, 26, 0.6); }
        .joystick-ring { border: 2px solid rgba(123, 219, 128, 0.1); box-shadow: 0 0 40px rgba(123, 219, 128, 0.05); }
        .landscape-lock { aspect-ratio: 16 / 9; max-height: 100vh; margin: 0 auto; position: relative; }
        .btn-control { @apply flex items-center justify-center px-4 py-1.5 rounded-full border text-[10px] font-headline font-bold tracking-widest uppercase transition-all active:scale-95; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 m-0 text-on-surface select-none">
<div class="landscape-lock w-full bg-background overflow-hidden relative border-x border-outline-variant/10">
    <!-- TopAppBar -->
    <header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 h-12 bg-[#10141a]/80 dark:bg-[#0a0e14]/60 backdrop-blur-xl shadow-[0_40px_40px_-15px_rgba(0,0,0,0.06)]">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[#7bdb80]">flight_takeoff</span>
            <!-- Removed Title Text as requested -->
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-4 bg-surface-container-low px-4 py-1 rounded-full border border-outline-variant/10">
                <div class="flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[14px] text-primary">battery_full</span>
                    <span class="text-[10px] font-bold font-headline tracking-widest uppercase">94%</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[14px] text-primary">signal_cellular_alt</span>
                    <span class="text-[10px] font-bold font-headline tracking-widest uppercase">48ms</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[14px] text-primary">satellite_alt</span>
                    <span class="text-[10px] font-bold font-headline tracking-widest uppercase">18</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button class="w-8 h-8 flex items-center justify-center rounded-full bg-[#31353c] hover:bg-surface-container-highest transition-colors active:scale-95 duration-200">
                <span class="material-symbols-outlined text-[18px] text-on-surface">videocam</span>
            </button>
            <button class="w-8 h-8 flex items-center justify-center rounded-full bg-[#31353c] hover:bg-surface-container-highest transition-colors active:scale-95 duration-200">
                <span class="material-symbols-outlined text-[18px] text-on-surface">settings</span>
            </button>
        </div>
    </header>
    <main class="relative w-full h-full pt-12 pb-10 px-8 flex flex-col justify-between">
        <!-- Top HUD Row (Intact) -->
        <div class="flex justify-between items-start mt-4">
            <div class="w-32 h-32 relative flex items-center justify-center bg-surface-container-low/40 rounded-xl border border-outline-variant/5">
                <svg class="w-20 h-20" viewbox="0 0 100 100">
                    <line stroke="#7bdb80" stroke-dasharray="2 2" stroke-width="0.5" x1="50" x2="50" y1="50" y2="10"></line>
                    <circle class="text-outline-variant" cx="50" cy="50" fill="none" r="30" stroke="currentColor" stroke-width="0.2"></circle>
                    <g transform="rotate(15, 50, 50)">
                        <path d="M40 40 L60 60 M40 60 L60 40" stroke="#7bdb80" stroke-linecap="round" stroke-width="2"></path>
                        <circle cx="50" cy="50" fill="#7bdb80" r="5"></circle>
                        <circle cx="40" cy="40" fill="white" r="2"></circle>
                        <circle cx="60" cy="60" fill="white" r="2"></circle>
                    </g>
                    <text fill="#7bdb80" font-size="5" font-weight="bold" x="52" y="15">Z</text>
                    <text fill="#7bdb80" font-size="5" font-weight="bold" x="85" y="52">X</text>
                </svg>
            </div>
            <div class="w-32 h-32 rounded-full border-2 border-outline-variant/10 overflow-hidden glass-panel relative group">
                <div class="absolute inset-0 opacity-40 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBaFD6MNdCGPlQKUlfImB8mkPLhgsaDJjAGq_gY3eNrNlSJH_5Z_wUosRQyfDztFgQ3vihNaX-oyFoLAfc07tUEnhN0h9KuDeDUdwH58vd41Y3JEAo_HkafFYgOZDKJD9hTbgTiYced-NkSkxCxc3MtmciafcyhCX1xvzMtzIJLW6-NVlkkH6edMmOQkJ2dW15nuWc6B8FEnP-EuFnA_ZBbLUXnvO_tbc4oo1eCiFyfq-zGZN86woTQ1XsY9XMaqnE58kVuorJlpY4')"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-[1px] h-1/2 bg-primary origin-bottom absolute bottom-1/2 animate-[spin_4s_linear_infinite]"></div>
                    <div class="w-1.5 h-1.5 bg-primary rounded-full shadow-[0_0_10px_#7bdb80]"></div>
                </div>
            </div>
        </div>
        <!-- Main Flight Controls: Joysticks moved lower for ergonomics -->
        <div class="absolute bottom-16 left-0 right-0 flex items-center justify-between px-12 pointer-events-none">
            <!-- Left Stick (Thrust/Yaw) -->
            <div class="w-44 h-44 rounded-full joystick-ring glass-panel flex items-center justify-center pointer-events-auto cursor-grab active:cursor-grabbing border border-primary/5">
                <div class="w-14 h-14 rounded-full bg-surface-container-highest border border-primary/20 shadow-xl flex items-center justify-center">
                    <div class="w-5 h-5 rounded-full bg-primary/20 flex items-center justify-center">
                        <div class="w-2 h-2 rounded-full bg-primary"></div>
                    </div>
                </div>
            </div>
            <!-- Right Stick (Pitch/Roll) -->
            <div class="w-44 h-44 rounded-full joystick-ring glass-panel flex items-center justify-center pointer-events-auto cursor-grab active:cursor-grabbing border border-primary/5">
                <div class="w-14 h-14 rounded-full bg-surface-container-highest border border-primary/20 shadow-xl flex items-center justify-center">
                    <div class="w-5 h-5 rounded-full bg-primary/20 flex items-center justify-center">
                        <div class="w-2 h-2 rounded-full bg-primary"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Enhanced Button Set: Compact grid in center -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 w-80">
            <div class="grid grid-cols-3 gap-2">
                <button class="flex items-center justify-center px-4 py-1.5 rounded-lg border-2 border-error/40 text-error text-[10px] font-headline font-bold tracking-widest uppercase hover:bg-error/10 transition-all active:scale-95">
                    ARM
                </button>
                <button class="flex items-center justify-center px-4 py-1.5 rounded-lg border border-on-surface-variant/20 text-on-surface-variant text-[10px] font-headline font-bold tracking-widest uppercase hover:bg-surface-variant/40 transition-all active:scale-95">
                    DISARM
                </button>
                <button class="flex items-center justify-center px-4 py-1.5 rounded-lg bg-gradient-to-br from-primary to-primary-container text-on-primary text-[10px] font-headline font-bold tracking-widest uppercase shadow-[0_0_10px_rgba(123,219,128,0.2)] hover:shadow-[0_0_20px_rgba(123,219,128,0.4)] transition-all active:scale-95">
                    TAKEOFF
                </button>
                <button class="flex items-center justify-center px-4 py-1.5 rounded-lg border border-primary/40 text-primary text-[10px] font-headline font-bold tracking-widest uppercase hover:bg-primary/10 transition-all active:scale-95">
                    LAND
                </button>
                <button class="flex items-center justify-center px-4 py-1.5 rounded-lg border border-on-surface-variant/20 text-on-surface-variant text-[10px] font-headline font-bold tracking-widest uppercase hover:bg-surface-variant/40 transition-all active:scale-95">
                    RTL
                </button>
                <button class="flex items-center justify-center px-4 py-1.5 rounded-lg border border-secondary/40 text-secondary text-[10px] font-headline font-bold tracking-widest uppercase hover:bg-secondary/10 transition-all active:scale-95">
                    HOLD
                </button>
            </div>
        </div>
    </main>
    <!-- Bottom: Telemetry Line (Intact) -->
    <footer class="absolute bottom-0 left-0 w-full h-8 bg-surface-container-lowest/80 backdrop-blur-sm flex items-center justify-center border-t border-outline-variant/10">
        <div class="flex items-center gap-8 font-mono text-[10px] tracking-tight text-on-surface/40">
            <div class="flex gap-2">
                <span class="text-primary/60">QUAT:</span>
                <span>W: 0.999 X: 0.002 Y: -0.001 Z: 0.005</span>
            </div>
            <div class="flex gap-2">
                <span class="text-primary/60">ALT:</span>
                <span class="text-on-surface/80">42.45m</span>
            </div>
            <div class="flex gap-2">
                <span class="text-primary/60">SPD:</span>
                <span class="text-on-surface/80">0.00m/s</span>
            </div>
        </div>
    </footer>
    <!-- HUD Overlays (Intact) -->
    <div class="absolute top-1/2 left-8 -translate-y-1/2 flex flex-col gap-12 pointer-events-none opacity-40">
        <div class="h-40 w-px bg-gradient-to-b from-transparent via-primary to-transparent relative">
            <div class="absolute top-0 -left-1 text-[8px] font-headline">100</div>
            <div class="absolute top-1/2 -left-1 text-[8px] font-headline">50</div>
            <div class="absolute bottom-0 -left-1 text-[8px] font-headline">0</div>
        </div>
    </div>
    <div class="absolute top-1/2 right-8 -translate-y-1/2 flex flex-col gap-12 pointer-events-none opacity-40">
        <div class="h-40 w-px bg-gradient-to-b from-transparent via-primary to-transparent relative">
            <div class="absolute top-0 -right-4 text-[8px] font-headline">MAX</div>
            <div class="absolute bottom-0 -right-4 text-[8px] font-headline">MIN</div>
        </div>
    </div>
</div>
</body></html>
